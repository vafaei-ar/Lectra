[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lectra-voice"
version = "0.2.0"
description = "Local voice rendering service for Lectra presentation narration"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "uvicorn>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
qwen3 = ["qwen-tts"]
chatterbox = ["chatterbox-tts>=0.1.7"]

[project.scripts]
lectra-voice = "lectra_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
